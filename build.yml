name: Build APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unpack project
        run: unzip -q ios7-launcher.zip
      - name: Build debug APK
        run: gradle -p ios7-launcher assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ios7-launcher-apk
          path: ios7-launcher/app/build/outputs/apk/debug/app-debug.apk
